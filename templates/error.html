<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ title }} - Nexora</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="auth-back" href="/">← Back to home</a>

      <div class="landing-badge">{{ code }}</div>

      <h1>{{ title }}</h1>

      <p class="auth-sub">{{ message }}</p>

      <div class="auth-actions">
        <a class="btn-primary" href="{{ url_for('home') }}">Go to your dashboard</a>
      </div>
    </section>
  </main>
</body>
</html>
