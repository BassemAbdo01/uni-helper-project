<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login - Uni Helper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <main class="landing">
    <section class="landing-hero" style="max-width:520px;">
      <div class="landing-badge">Welcome back</div>
      <h1 style="font-size:38px;">Log in</h1>

      {% if error %}
        <p style="color:#ff3b30; font-weight:900;">{{ error }}</p>
      {% endif %}

      <form method="POST" class="formstack" style="margin-top:24px;">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button class="btn" type="submit">Log in</button>
      </form>

      <div class="landing-note">
        No account yet? <a href="/signup" style="font-weight:900;">Create one</a>
      </div>
    </section>
  </main>
</body>
</html>
