{% extends "auth_base.html" %}
{% block title %}Log in — Nexora{% endblock %}

{% block body %}
  <p class="eyebrow">Welcome back</p>
  <h1>Log in to <em>Nexora</em>.</h1>
  <p class="sub">Your term is where you left it.</p>

  {% if error %}<div class="note bad">{{ error }}</div>{% endif %}

  <form method="POST">
    <div class="field">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email"
             placeholder="you@university.ca" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
             placeholder="Your password" required>
    </div>
    <button type="submit">Log in</button>
  </form>

  <div class="foot">
    <span><a href="{{ url_for('forgot_password') }}">Forgot your password?</a></span>
    <span>New to Nexora? <a href="{{ url_for('signup') }}">Create an account</a></span>
  </div>
{% endblock %}
