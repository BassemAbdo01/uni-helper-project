<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sign up - Uni Helper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <main class="landing">
    <section class="landing-hero" style="max-width:520px;">
      <div class="landing-badge">Start organizing</div>
      <h1 style="font-size:38px;">Create account</h1>

      {% if error %}
        <p style="color:#ff3b30; font-weight:900;">{{ error }}</p>
      {% endif %}

      <form method="POST" class="formstack" style="margin-top:24px;">
        <input type="text" name="name" placeholder="Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button class="btn" type="submit">Create account</button>
      </form>

      <div class="landing-note">
        Already have an account? <a href="/login" style="font-weight:900;">Log in</a>
      </div>
    </section>
  </main>
</body>
</html>
