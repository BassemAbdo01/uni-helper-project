<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Profile - Uni Helper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <main class="landing">
    <section class="landing-hero" style="max-width:560px;">
      <div class="landing-badge">Your account</div>
      <h1 style="font-size:38px;">Profile</h1>

      <div class="profile-page-avatar">
        {{ user.name[0]|upper if user and user.name else "U" }}
      </div>

      <div class="profile-page-info">
        <div><strong>Name:</strong> {{ user.name }}</div>
        <div><strong>Email:</strong> {{ user.email }}</div>
      </div>

      <div class="landing-actions">
        <a class="btn landing-btn" href="/dashboard">Back to dashboard</a>
        <a class="btn secondary landing-btn" href="/feedback">Send feedback</a>
        <a class="btn danger landing-btn" href="/logout">Log out</a>
      </div>

      <div class="landing-note">
        Profile picture and account settings are coming later.
      </div>
    </section>
  </main>
</body>
</html>
