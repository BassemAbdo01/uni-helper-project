<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin Feedback - Uni Helper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <main class="landing admin-page">
    <section class="landing-hero admin-panel">
      <div class="landing-badge">Admin</div>
      <h1 style="font-size:38px;">Student feedback</h1>

      <div class="landing-actions">
        <a class="btn secondary landing-btn" href="/dashboard">Back to dashboard</a>
      </div>

      <div class="admin-feedback-list">
        {% if feedback_messages %}
          {% for fb in feedback_messages %}
            <div class="feedback-card">
              <div class="feedback-meta">
                Feedback #{{ fb.id }} • {{ fb.created_at }}
              </div>

              <div class="feedback-user">
                User ID: {{ fb.user_id }}
              </div>

              <div class="feedback-message">
                {{ fb.message }}
              </div>
            </div>
          {% endfor %}
        {% else %}
          <div class="landing-note">No feedback yet.</div>
        {% endif %}
      </div>
    </section>
  </main>
</body>
</html>
