<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Feedback - Uni Helper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <main class="landing">
    <section class="landing-hero" style="max-width:620px;">
      <div class="landing-badge">Help improve Uni Helper</div>
      <h1 style="font-size:38px;">Send feedback</h1>

      <p>
        Found something confusing? Want a new feature? Send your feedback here.
      </p>

      {% if error %}
        <p style="color:#ff3b30; font-weight:900;">{{ error }}</p>
      {% endif %}

      {% if success %}
        <p style="color:#16a34a; font-weight:900;">{{ success }}</p>
      {% endif %}

      <form method="POST" class="formstack" style="margin-top:22px;">
        <textarea name="message" placeholder="Write your feedback here..." required></textarea>
        <button class="btn" type="submit">Send feedback</button>
      </form>

      <div class="landing-actions">
        <a class="btn secondary landing-btn" href="/dashboard">Back to dashboard</a>
      </div>
    </section>
  </main>
</body>
</html>
