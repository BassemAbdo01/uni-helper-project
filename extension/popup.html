<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/* Same palette as the Nexora app. No web fonts: a popup should never wait on
   the network to render. */
:root{
  --bg:#151310; --surface:#1E1B17; --surface-2:#262218;
  --line:#37322B; --line-2:#4A443B;
  --fg:#F7F4EF; --fg-2:#B8B1A5; --fg-3:#857E74;
  --amber:#E8A94A; --green:#7FB08A; --red:#C9705C;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{width:340px;margin:0;padding:18px;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5}

h1{font-size:16px;margin:0 0 16px;display:flex;align-items:center;gap:9px;font-weight:600}
h1 i{width:7px;height:7px;border-radius:50%;background:var(--amber);font-style:normal;flex:none}
h1 b{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--fg-3);font-weight:400}

/* The whole popup is one instruction and one button. */
.step{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--amber);margin-bottom:8px}
.headline{font-size:16px;font-weight:600;margin:0 0 6px;line-height:1.35}
.detail{color:var(--fg-2);font-size:13px;margin:0}

button{width:100%;margin-top:14px;padding:11px;border-radius:6px;border:1px solid var(--amber);
  background:var(--amber);color:#140F09;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
button:hover:not(:disabled){filter:brightness(1.06)}
button.secondary{background:transparent;border-color:var(--line-2);color:var(--fg-2);font-weight:500;
  font-size:13px;padding:9px}
button.secondary:hover:not(:disabled){border-color:var(--fg-3);color:var(--fg)}
button:disabled{opacity:.45;cursor:default}

.bar{height:3px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:14px;display:none}
.bar.on{display:block}
.bar i{display:block;height:100%;width:35%;background:var(--amber);
  animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}

.result{margin-top:14px;padding:11px 12px;border:1px solid var(--line);border-radius:6px;
  background:var(--surface);font-size:12.5px;color:var(--fg-2);white-space:pre-wrap;
  max-height:170px;overflow:auto;display:none}
.result.on{display:block}
.result.bad{border-color:rgba(201,112,92,.45)}
.result.good{border-color:rgba(127,176,138,.45)}

details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
summary{font-size:12px;color:var(--fg-3);cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"› ";color:var(--fg-3)}
details[open] summary:before{content:"⌄ "}
label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--fg-3);margin:12px 0 6px}
input,select{width:100%;background:var(--surface-2);border:1px solid var(--line-2);color:var(--fg);
  padding:8px 10px;border-radius:5px;font:inherit;font-size:13px}
input:focus,select:focus{outline:none;border-color:var(--amber)}
.toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-2);margin-top:12px}
.toggle input{width:auto}
.foot{font-size:11px;color:var(--fg-3);margin-top:14px;line-height:1.5}

/* The import-scope question. Two answers, both visible at once: a student
   choosing between "everything" and "this term" should not have to open a
   dropdown to discover the second option exists. */
.choices{display:grid;gap:8px;margin-top:12px}
.choices[hidden]{display:none}
.choice{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);cursor:pointer}
.choice:hover{border-color:var(--line-2)}
.choice:has(input:checked){border-color:var(--amber);background:var(--surface-2)}
.choice input{width:auto;margin:2px 0 0;accent-color:var(--amber);flex:none}
.choice b{display:block;font-size:13.5px;font-weight:600}
.choice small{display:block;color:var(--fg-2);font-size:11.5px;line-height:1.45;margin-top:2px}
#scopeTerm{margin:-2px 0 2px 28px;width:calc(100% - 28px)}
#scopeTerm:disabled{opacity:.5}
</style>
</head>
<body>
  <h1><i></i>Nexora Sync<b id="ver">3.4.3</b></h1>

  <p class="step" id="step">Step 1 of 2</p>
  <p class="headline" id="headline">Connect to Nexora</p>
  <p class="detail" id="detail">Checking…</p>

  <div class="choices" id="scope" hidden>
    <label class="choice">
      <input type="radio" name="scope" value="term" checked>
      <span><b>Only this term</b><small id="scopeTermHint">The term you are enrolled in now.</small></span>
    </label>
    <select id="scopeTerm" aria-label="Which term to import"></select>
    <label class="choice">
      <input type="radio" name="scope" value="all">
      <span><b>Everything</b><small>Every term you have ever been enrolled in. Your dashboard still opens on the current one, with the rest a click away.</small></span>
    </label>
  </div>

  <button id="go" disabled>…</button>
  <div class="bar" id="bar"><i></i></div>
  <div class="result" id="result"></div>

  <button class="secondary" id="outline">Read the outline on this page</button>

  <details id="advanced">
    <summary>Advanced</summary>

    <label class="toggle" style="margin-top:14px">
      <input id="autoSync" type="checkbox"> Keep courses up to date automatically
    </label>

    <label for="scopeSetting">What to import</label>
    <select id="scopeSetting">
      <option value="term">Only one term</option>
      <option value="all">Every term</option>
    </select>

    <label for="termSetting">Which term</label>
    <select id="termSetting"></select>

    <label for="interval">Check every</label>
    <select id="interval">
      <option value="15">15 minutes</option>
      <option value="30">30 minutes</option>
      <option value="60">60 minutes</option>
    </select>

    <label for="apiBase">Nexora URL</label>
    <input id="apiBase" placeholder="https://uni-helper-project.onrender.com">

    <label for="token">Extension key</label>
    <input id="token" type="password" placeholder="Set automatically when you connect">

    <button class="secondary" id="save">Save these settings</button>
  </details>

  <p class="foot">
    Nexora reads Brightspace or Canvas through the session you are already signed into,
    and never sees your university password.
  </p>

  <script src="popup.js"></script>
</body>
</html>
