<!doctype html><html><head><meta charset="utf-8"><style>
body{width:350px;margin:0;padding:18px;background:#080b18;color:#fff;font-family:Inter,Arial}h1{font-size:19px;margin:0 0 4px}.sub{color:#929ab7;font-size:12px;margin-bottom:15px}label{display:block;font-size:12px;margin:10px 0 6px}input{width:100%;box-sizing:border-box;background:#0e1326;border:1px solid #2b3150;color:#fff;padding:10px;border-radius:10px}button{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:linear-gradient(90deg,#6d28d9,#9333ea);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#151a30;border:1px solid #303754}#status{font-size:12px;color:#cbd5e1;margin-top:12px;white-space:pre-wrap;line-height:1.5;padding:10px;background:#0d1224;border-radius:10px;min-height:38px}.note{font-size:11px;color:#777f9c;margin-top:12px;line-height:1.4}.good{color:#a7f3d0}.bad{color:#fca5a5}</style></head>
<body><h1>Nexora Sync</h1><div class="sub">Course discovery + content import</div><label>Nexora URL</label><input id="apiBase" placeholder="https://your-app.onrender.com"><label>Extension key</label><input id="token" type="password" placeholder="Paste key from Nexora"><button id="save">Save connection</button><button id="import">Open Brightspace & import everything</button><button class="secondary" id="scan">Scan open Brightspace pages</button><div id="status">Not connected yet.</div><div class="note">The extension uses your existing Brightspace login. Nexora never receives or stores your Brightspace password.</div><script src="popup.js"></script></body></html>
