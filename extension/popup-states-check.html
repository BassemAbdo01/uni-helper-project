<meta charset="utf-8"><title>popup states</title>
<style>body{background:#151310;color:#B8B1A5;font:13px ui-monospace,Menlo,monospace;padding:20px}
pre{white-space:pre-wrap;line-height:1.7}</style>
<pre id="out">running…</pre>
<script>
(async () => {
  const out = document.getElementById('out');
  try {
    const src = await (await fetch('popup.js?' + Date.now())).text();

    // the popup drives real DOM ids; give it somewhere to write
    const selects = ['interval'];
    const inputs = ['apiBase', 'token', 'autoSync'];
    const ids = ['step','headline','detail','go','result','bar','outline','save',
                 ...selects, ...inputs];
    for (const id of ids) {
      const el = document.createElement(selects.includes(id) ? 'select'
                                      : inputs.includes(id) ? 'input' : 'div');
      el.id = id; el.style.display = 'none'; document.body.append(el);
    }
    const advanced = document.createElement('details');
    advanced.id = 'advanced'; advanced.style.display = 'none'; document.body.append(advanced);
    // There is no "what should Nexora import?" any more -- it is always
    // everything -- so there is no scope screen left to render.

    // label, url, configured, brightspaceOrigin, originGranted, importScope, importTerm, syncStatus
    const scenarios = [
      ['Brightspace tab',        'https://brightspace.carleton.ca/d2l/home',        true,  '', false, '', ''],
      ['Canvas, campus domain',  'https://canvas.school.edu/courses',               true,  '', false, '', ''],
      ['Canvas, instructure',    'https://school.instructure.com/?login_success=1', true,  '', false, '', ''],
      ['Canvas-ish /courses',    'https://learn.uni.edu/courses/4021',              true,  '', false, '', ''],
      ['not an LMS, none known', 'https://www.google.com/search?q=hi',              true,  '', false, '', ''],
      ['not an LMS, BS known',   'https://www.google.com/search?q=hi',              true,  'https://brightspace.carleton.ca', false, '', ''],
      ['not paired yet',         'https://canvas.school.edu/courses',               false, '', false, '', ''],
      // Permission granted. There is nothing to ask, so this is Ready to sync
      // whatever an older install happened to store.
      ['granted, never synced',  'https://brightspace.carleton.ca/d2l/home',        true,  'https://brightspace.carleton.ca', true, '', ''],
      ['granted, stored all',    'https://brightspace.carleton.ca/d2l/home',        true,  'https://brightspace.carleton.ca', true, 'all', ''],
      ['granted, stale one-term','https://brightspace.carleton.ca/d2l/home',        true,  'https://brightspace.carleton.ca', true, 'term', 'Fall 2026'],
      // A sync in flight outranks everything: the popup closing does not stop
      // it, so this screen must never imply that it did.
      ['sync running',           'https://brightspace.carleton.ca/d2l/home',        true,  'https://brightspace.carleton.ca', true, 'term', 'Fall 2026',
       { running: true, phase: 'smart-sync', currentCourse: 'BIOL1103', progress: '3/12' }],
      ['sync running, off-LMS',  'https://www.google.com/search?q=hi',               true,  'https://brightspace.carleton.ca', true, 'all', '',
       { running: true, phase: 'finding-courses' }]
    ];

    const lines = [];
    for (const [label, url, configured, bsOrigin, granted, importScope, importTerm, syncStatus] of scenarios) {
      window.chrome = {
        runtime: { sendMessage: async m => m.type === 'NEXORA_STATUS' ? {
          ok: true, configured, originGranted: granted,
          syncStatus: syncStatus || {},
          config: { apiBase: 'https://x', token: configured ? 't' : '',
                    autoSyncEnabled: true, intervalMinutes: 30,
                    brightspaceOrigin: bsOrigin, importScope, importTerm,
                    includeFinished: importScope === 'all' }
        } : { ok: true } },
        tabs: { query: async () => [{ id: 1, url }], create: async () => {} },
        storage: { sync: { get: async () => ({}), set: async () => {} }, local: { set: async () => {} } },
        permissions: { request: async () => true, contains: async () => granted }
      };

      // re-evaluate with a fresh copy of the script each time
      const run = new Function(src + '\n;return evaluate();');
      await run();
      lines.push(`${label.padEnd(24)} -> ${document.getElementById('headline').textContent}`
               + `  [${document.getElementById('go').textContent}]`
               + (document.getElementById('go').disabled ? ' (disabled)' : '')
               + `\n${''.padEnd(28)}${document.getElementById('detail').textContent}`);
    }

    out.textContent = lines.join('\n');
  } catch (e) {
    out.textContent = 'ERROR ' + e.name + ': ' + e.message + '\n\n' + (e.stack || '');
  }
})();
</script>
